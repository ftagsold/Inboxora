[package]
name = "inboxora-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14.2"
fallible-iterator = "0.2"
fred = { version = "10.1.0", features = ["i-pubsub", "subscriber-client", "unix-sockets"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
postgres-protocol = "0.6.12"
postgres-types = "0.2.14"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4", "array-impls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[lints]
workspace = true
