[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Handlers return `Err(Response)` early by design, row tuples name their columns in place, and
# a few ports keep the Node signature (e.g. listMessages) for traceability.
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Release build with line tables for perf/flamegraph and PGO training.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
