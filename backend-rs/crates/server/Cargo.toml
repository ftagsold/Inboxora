[package]
name = "inboxora-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
fred = "10.1.0"
futures-util = "0.3.34"
http-body = "1.1.0"
http-body-util = "0.1.5"
inboxora-core = { version = "5.0.0", path = "../core" }
inboxora-mail = { version = "5.0.0", path = "../mail" }
inboxora-net = { version = "5.0.0", path = "../net" }
inboxora-pim = { version = "5.0.0", path = "../pim" }
mimalloc = "0.1.52"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = "1.28.0"

[lints]
workspace = true
