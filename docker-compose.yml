# Rotate container logs (Docker keeps json-file logs forever by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

services:

  # ── Inboxora (API + web app) ─────────────────────────────────────────────────
  # One container: the Rust server answers the API and serves the web app. It exposes HTTPS on
  # APP_PORT (certificate from ./certs, self-signed when absent) and HTTP on APP_HTTP_PORT, which
  # is meant for use behind a reverse proxy that terminates TLS.
  # With --profile https, Caddy handles TLS instead (see below).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-dev}
        VITE_BUILD_SHA: ${GIT_SHA:-dev}
        VITE_EMAIL_DIV_RENDER: ${VITE_EMAIL_DIV_RENDER:-false}
    container_name: mailflow-backend
    logging: *logging
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:3443"
      - "${APP_HTTP_PORT:-80}:3000"
    # Root by default so the server can read and write ./certs like the former nginx container
    # did; set PUID/PGID (e.g. 99:100 on Unraid) to run unprivileged, with ./certs owned by them.
    user: "${PUID:-0}:${PGID:-0}"
    volumes:
      - ./certs:/app/certs
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # App name in the browser tab, login screen and sidebar; applied at container start.
      VITE_APP_NAME: ${VITE_APP_NAME:-Inboxora}
      # The bundled ntfy, proxied at /up…, /v1 and /push (see the ntfy service below).
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mailflow}
      DB_USER: ${DB_USER:-mailflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      PUSH_ALLOW_PRIVATE_ENDPOINTS: ${PUSH_ALLOW_PRIVATE_ENDPOINTS:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
      IMAP_MAX_CONNECTIONS_PER_ACCOUNT: ${IMAP_MAX_CONNECTIONS_PER_ACCOUNT:-}
      MAIL_BODY_TTL_SECONDS: ${MAIL_BODY_TTL_SECONDS:-}
      # ── OIDC / SSO providers (optional) ──────────────────────────────────────
      # Each OIDC_<N>_* block below declares one SSO provider without touching the admin UI.
      # Wired up to 3 slots (N=1..3) by default — copy a block and bump N to add more.
      # Providers are only ever CREATED from these vars on first boot (matched by slug); once
      # a provider row exists, the admin UI owns it and further env changes are ignored.
      # See .env.example for the full list of OIDC_<N>_* vars, including the MAIL_* ones that
      # auto-provision a per-user IMAP/SMTP mailbox authenticated via that provider's OIDC token
      # instead of a password ("OIDC passthrough").
      OIDC_1_ISSUER_URL: ${OIDC_1_ISSUER_URL:-}
      OIDC_1_CLIENT_ID: ${OIDC_1_CLIENT_ID:-}
      OIDC_1_CLIENT_SECRET: ${OIDC_1_CLIENT_SECRET:-}
      OIDC_1_NAME: ${OIDC_1_NAME:-}
      OIDC_1_SLUG: ${OIDC_1_SLUG:-}
      OIDC_1_SCOPES: ${OIDC_1_SCOPES:-}
      OIDC_1_PROVISIONING_MODE: ${OIDC_1_PROVISIONING_MODE:-}
      OIDC_1_ALLOWED_DOMAINS: ${OIDC_1_ALLOWED_DOMAINS:-}
      OIDC_1_ENABLED: ${OIDC_1_ENABLED:-}
      OIDC_1_REQUIRE_EMAIL_VERIFIED: ${OIDC_1_REQUIRE_EMAIL_VERIFIED:-}
      OIDC_1_ALLOW_INSECURE: ${OIDC_1_ALLOW_INSECURE:-}
      OIDC_1_ADMIN_GROUP_CLAIM: ${OIDC_1_ADMIN_GROUP_CLAIM:-}
      OIDC_1_ADMIN_GROUP_VALUE: ${OIDC_1_ADMIN_GROUP_VALUE:-}
      OIDC_1_RP_INITIATED_LOGOUT: ${OIDC_1_RP_INITIATED_LOGOUT:-}
      OIDC_1_LOGIN_MATCH_CLAIM: ${OIDC_1_LOGIN_MATCH_CLAIM:-}
      OIDC_1_MAIL_IMAP_HOST: ${OIDC_1_MAIL_IMAP_HOST:-}
      OIDC_1_MAIL_IMAP_PORT: ${OIDC_1_MAIL_IMAP_PORT:-}
      OIDC_1_MAIL_IMAP_TLS: ${OIDC_1_MAIL_IMAP_TLS:-}
      OIDC_1_MAIL_SMTP_HOST: ${OIDC_1_MAIL_SMTP_HOST:-}
      OIDC_1_MAIL_SMTP_PORT: ${OIDC_1_MAIL_SMTP_PORT:-}
      OIDC_1_MAIL_SMTP_TLS: ${OIDC_1_MAIL_SMTP_TLS:-}
      OIDC_1_MAIL_USERNAME_CLAIM: ${OIDC_1_MAIL_USERNAME_CLAIM:-}
      OIDC_1_MAIL_SKIP_TLS_VERIFY: ${OIDC_1_MAIL_SKIP_TLS_VERIFY:-}
      OIDC_1_MAIL_NAME: ${OIDC_1_MAIL_NAME:-}
      OIDC_2_ISSUER_URL: ${OIDC_2_ISSUER_URL:-}
      OIDC_2_CLIENT_ID: ${OIDC_2_CLIENT_ID:-}
      OIDC_2_CLIENT_SECRET: ${OIDC_2_CLIENT_SECRET:-}
      OIDC_2_NAME: ${OIDC_2_NAME:-}
      OIDC_2_SLUG: ${OIDC_2_SLUG:-}
      OIDC_2_SCOPES: ${OIDC_2_SCOPES:-}
      OIDC_2_PROVISIONING_MODE: ${OIDC_2_PROVISIONING_MODE:-}
      OIDC_2_ALLOWED_DOMAINS: ${OIDC_2_ALLOWED_DOMAINS:-}
      OIDC_2_ENABLED: ${OIDC_2_ENABLED:-}
      OIDC_2_REQUIRE_EMAIL_VERIFIED: ${OIDC_2_REQUIRE_EMAIL_VERIFIED:-}
      OIDC_2_ALLOW_INSECURE: ${OIDC_2_ALLOW_INSECURE:-}
      OIDC_2_ADMIN_GROUP_CLAIM: ${OIDC_2_ADMIN_GROUP_CLAIM:-}
      OIDC_2_ADMIN_GROUP_VALUE: ${OIDC_2_ADMIN_GROUP_VALUE:-}
      OIDC_2_RP_INITIATED_LOGOUT: ${OIDC_2_RP_INITIATED_LOGOUT:-}
      OIDC_2_LOGIN_MATCH_CLAIM: ${OIDC_2_LOGIN_MATCH_CLAIM:-}
      OIDC_2_MAIL_IMAP_HOST: ${OIDC_2_MAIL_IMAP_HOST:-}
      OIDC_2_MAIL_IMAP_PORT: ${OIDC_2_MAIL_IMAP_PORT:-}
      OIDC_2_MAIL_IMAP_TLS: ${OIDC_2_MAIL_IMAP_TLS:-}
      OIDC_2_MAIL_SMTP_HOST: ${OIDC_2_MAIL_SMTP_HOST:-}
      OIDC_2_MAIL_SMTP_PORT: ${OIDC_2_MAIL_SMTP_PORT:-}
      OIDC_2_MAIL_SMTP_TLS: ${OIDC_2_MAIL_SMTP_TLS:-}
      OIDC_2_MAIL_USERNAME_CLAIM: ${OIDC_2_MAIL_USERNAME_CLAIM:-}
      OIDC_2_MAIL_SKIP_TLS_VERIFY: ${OIDC_2_MAIL_SKIP_TLS_VERIFY:-}
      OIDC_2_MAIL_NAME: ${OIDC_2_MAIL_NAME:-}
      OIDC_3_ISSUER_URL: ${OIDC_3_ISSUER_URL:-}
      OIDC_3_CLIENT_ID: ${OIDC_3_CLIENT_ID:-}
      OIDC_3_CLIENT_SECRET: ${OIDC_3_CLIENT_SECRET:-}
      OIDC_3_NAME: ${OIDC_3_NAME:-}
      OIDC_3_SLUG: ${OIDC_3_SLUG:-}
      OIDC_3_SCOPES: ${OIDC_3_SCOPES:-}
      OIDC_3_PROVISIONING_MODE: ${OIDC_3_PROVISIONING_MODE:-}
      OIDC_3_ALLOWED_DOMAINS: ${OIDC_3_ALLOWED_DOMAINS:-}
      OIDC_3_ENABLED: ${OIDC_3_ENABLED:-}
      OIDC_3_REQUIRE_EMAIL_VERIFIED: ${OIDC_3_REQUIRE_EMAIL_VERIFIED:-}
      OIDC_3_ALLOW_INSECURE: ${OIDC_3_ALLOW_INSECURE:-}
      OIDC_3_ADMIN_GROUP_CLAIM: ${OIDC_3_ADMIN_GROUP_CLAIM:-}
      OIDC_3_ADMIN_GROUP_VALUE: ${OIDC_3_ADMIN_GROUP_VALUE:-}
      OIDC_3_RP_INITIATED_LOGOUT: ${OIDC_3_RP_INITIATED_LOGOUT:-}
      OIDC_3_LOGIN_MATCH_CLAIM: ${OIDC_3_LOGIN_MATCH_CLAIM:-}
      OIDC_3_MAIL_IMAP_HOST: ${OIDC_3_MAIL_IMAP_HOST:-}
      OIDC_3_MAIL_IMAP_PORT: ${OIDC_3_MAIL_IMAP_PORT:-}
      OIDC_3_MAIL_IMAP_TLS: ${OIDC_3_MAIL_IMAP_TLS:-}
      OIDC_3_MAIL_SMTP_HOST: ${OIDC_3_MAIL_SMTP_HOST:-}
      OIDC_3_MAIL_SMTP_PORT: ${OIDC_3_MAIL_SMTP_PORT:-}
      OIDC_3_MAIL_SMTP_TLS: ${OIDC_3_MAIL_SMTP_TLS:-}
      OIDC_3_MAIL_USERNAME_CLAIM: ${OIDC_3_MAIL_USERNAME_CLAIM:-}
      OIDC_3_MAIL_SKIP_TLS_VERIFY: ${OIDC_3_MAIL_SKIP_TLS_VERIFY:-}
      OIDC_3_MAIL_NAME: ${OIDC_3_MAIL_NAME:-}
      OIDC_AUTO_LOGIN: ${OIDC_AUTO_LOGIN:-}
      PASSWORD_LOGIN_DISABLED: ${PASSWORD_LOGIN_DISABLED:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless image: the server binary probes /api/health itself.
      test: ["CMD", "/app/inboxora-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mailflow

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    logging: *logging
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    # PUID/PGID default to 0:0 (root), identical to the image's normal behaviour.
    # Set them (e.g. 99:100 on Unraid) only when bind-mounting POSTGRES_DATA to a host
    # share, and chown that share to the same uid:gid first.
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    logging: *logging
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    # Memory only: nothing is written to disk (no RDB, no AOF, /data is tmpfs). A Redis restart
    # signs everyone out and empties the mail cache, which the server preloads again. Mail display
    # fields never expire and bodies expire after MAIL_BODY_TTL_SECONDS (7 days); volatile-ttl only
    # evicts keys with a TTL, so keep REDIS_MAXMEMORY above the cache size (the server warns at 80%).
    command: redis-server --save "" --appendonly no --loglevel warning --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-ttl
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

  # ── ntfy (built-in UnifiedPush transport) ────────────────────────────────────
  # Android instant notifications travel: Inboxora -> this ntfy -> UnifiedPush
  # distributor (ntfy Android app) -> Inboxora Android. The Inboxora server
  # proxies the UnifiedPush namespace at the domain origin (NTFY_URL) and this
  # container never publishes a host port.
  #
  # Why the origin and not a path: ntfy 2.28 refuses a base-url containing a path
  # ("hosting ntfy on a sub-path is not supported") AND the ntfy Android app
  # rejects a base URL with a path. Inboxora therefore routes only "/up" + 12 base62
  # chars and "/v1" to ntfy (the SPA keeps every other path); /push/ is kept as a
  # compatibility alias.
  #
  # Anonymous access is limited to UnifiedPush topics ("up" + 12 random base62
  # characters generated on-device, ~71 bits, never derived from a user id or
  # address). Everything else is denied: this is not a public topic server.
  #
  # Advanced: to use your own external ntfy instead, set PUSH_BASE_URL and start
  # with docker-compose.external-ntfy.yml, which disables this service.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: mailflow-ntfy
    logging: *logging
    restart: unless-stopped
    command: serve
    environment:
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: ${NTFY_CACHE_DURATION:-12h}
      NTFY_AUTH_FILE: /var/cache/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_ACCESS: "*:up*:rw"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "60"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: 5s
      NTFY_VISITOR_MESSAGE_DAILY_LIMIT: "500"
    volumes:
      - ${NTFY_DATA:-ntfy_data}:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mailflow

  # ── Caddy (automatic HTTPS via Let's Encrypt — production only) ──────────────
  # Use docker-compose.https.yml to avoid the port conflict with the Inboxora container:
  #   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d --build
  # Requires DOMAIN, ACME_EMAIL, and APP_URL to be set in .env, and ports 80/443 to be open.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: mailflow-caddy
    logging: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - mailflow

volumes:
  postgres_data:
  ntfy_data:
  caddy_data:
  caddy_config:

networks:
  mailflow:
    driver: bridge
