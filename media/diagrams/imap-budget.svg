<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-label="IMAP connection budget and request priority">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="1039" height="379" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect x="30" y="110" width="220" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="30" y="110" width="6" height="140" rx="3" fill="#334155"/>
<g fill="none" stroke="#334155" stroke-width="1.8"><rect x="53" y="128" width="16" height="16" rx="3"/><path d="M57 133 h8 M57 137 h8 M57 141 h5"/></g>
<text x="80" y="143" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Requests</text>
<text x="52" y="170" font-size="13" fill="#475569" font-weight="400" text-anchor="start">from the interface,</text>
<text x="52" y="190" font-size="13" fill="#475569" font-weight="400" text-anchor="start">sync and preload</text>
<rect x="52" y="216" width="137.0" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="120.5" y="231" font-size="11.5" fill="#334155" font-weight="600" text-anchor="middle">queue by priority</text>
<line x1="254" y1="180" x2="316" y2="180" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320" y="80" width="250" height="200" rx="14" fill="#f5f3ff" stroke="#c4b5fd" filter="url(#shadow)"/>
<text x="445" y="114" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Connection budget</text>
<text x="445" y="136" font-size="13" fill="#475569" font-weight="400" text-anchor="middle">per account, default 10</text>
<rect x="345" y="156" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="387" y="156" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="429" y="156" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="471" y="156" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="513" y="156" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="345" y="198" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="387" y="198" width="32" height="32" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-opacity="1"/>
<rect x="429" y="198" width="32" height="32" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.45"/>
<rect x="471" y="198" width="32" height="32" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.45"/>
<rect x="513" y="198" width="32" height="32" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-opacity="0.45"/>
<text x="445" y="262" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">every socket holds one slot</text>
<line x1="574" y1="180" x2="636" y2="180" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text letter-spacing="1.2" x="640" y="46" font-size="11.5" fill="#6d28d9" font-weight="700" text-anchor="start">SERVED IN THIS ORDER</text>
<rect x="640" y="62" width="370" height="42" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<rect x="640" y="62" width="370" height="42" rx="10" fill="#4c1d95" fill-opacity="0.12"/>
<circle cx="662" cy="83" r="12" fill="#4c1d95"/>
<text x="662" y="87.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="686" y="88" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Interface</text>
<rect x="640" y="116" width="340" height="42" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<rect x="640" y="116" width="340" height="42" rx="10" fill="#6d28d9" fill-opacity="0.12"/>
<circle cx="662" cy="137" r="12" fill="#6d28d9"/>
<text x="662" y="141.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="686" y="142" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">INBOX</text>
<rect x="640" y="170" width="310" height="42" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<rect x="640" y="170" width="310" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.12"/>
<circle cx="662" cy="191" r="12" fill="#8b5cf6"/>
<text x="662" y="195.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="686" y="196" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Archive, Sent, Trash, Drafts, Junk</text>
<rect x="640" y="224" width="280" height="42" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<rect x="640" y="224" width="280" height="42" rx="10" fill="#a78bfa" fill-opacity="0.12"/>
<circle cx="662" cy="245" r="12" fill="#a78bfa"/>
<text x="662" y="249.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="686" y="250" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Other folders</text>
<rect x="640" y="278" width="250" height="42" rx="10" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<rect x="640" y="278" width="250" height="42" rx="10" fill="#c4b5fd" fill-opacity="0.12"/>
<circle cx="662" cy="299" r="12" fill="#c4b5fd"/>
<text x="662" y="303.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="686" y="304" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Background preload</text>
<text x="30" y="330" font-size="13" fill="#475569" font-weight="400" text-anchor="start">A refused or early-dropped connection lowers the limit by one:</text>
<text x="30" y="352" font-size="13" fill="#475569" font-weight="400" text-anchor="start">at most every 30 s, never below 2. The learned limit survives restarts.</text>
</g>
</svg>
