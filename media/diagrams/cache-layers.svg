<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Three cache layers in front of the IMAP server">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="1099" height="419" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="520" height="380" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="5 4"/><text letter-spacing="1.2" x="38" y="48" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start">BROWSER · PER USER</text>
<rect x="580" y="20" width="250" height="380" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="5 4"/><text letter-spacing="1.2" x="598" y="48" font-size="11.5" fill="#6d28d9" font-weight="700" text-anchor="start">INBOXORA SERVER</text>
<rect x="870" y="20" width="210" height="380" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-dasharray="5 4"/><text letter-spacing="1.2" x="888" y="48" font-size="11.5" fill="#047857" font-weight="700" text-anchor="start">MAIL PROVIDER</text>
<rect x="40" y="70" width="210" height="150" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<rect x="40" y="70" width="6" height="150" rx="3" fill="#1d4ed8"/>
<g fill="none" stroke="#1d4ed8" stroke-width="1.8"><rect x="63" y="88" width="16" height="16" rx="3"/><path d="M67 93 h8 M67 97 h8 M67 101 h5"/></g>
<text x="90" y="103" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Memory</text>
<text x="62" y="130" font-size="13" fill="#475569" font-weight="400" text-anchor="start">12 recent list views</text>
<text x="62" y="150" font-size="13" fill="#475569" font-weight="400" text-anchor="start">rows ready to paint</text>
<rect x="62" y="186" width="130.0" height="22" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="127.0" y="201" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">until tab closes</text>
<rect x="310" y="70" width="210" height="150" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<rect x="310" y="70" width="6" height="150" rx="3" fill="#1d4ed8"/>
<g fill="none" stroke="#1d4ed8" stroke-width="1.8"><ellipse cx="341" cy="92" rx="9" ry="3.5"/><path d="M332 92 v12 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-12"/><path d="M332 98 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5"/></g>
<text x="360" y="103" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">IndexedDB</text>
<text x="332" y="130" font-size="13" fill="#475569" font-weight="400" text-anchor="start">display fields</text>
<text x="332" y="150" font-size="13" fill="#475569" font-weight="400" text-anchor="start">2,000 bodies</text>
<rect x="332" y="186" width="109.0" height="22" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="386.5" y="201" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">bodies 7 days</text>
<rect x="600" y="70" width="210" height="150" rx="12" fill="#ffffff" stroke="#fca5a5" filter="url(#shadow)"/>
<rect x="600" y="70" width="6" height="150" rx="3" fill="#b91c1c"/>
<g fill="none" stroke="#b91c1c" stroke-width="1.8"><ellipse cx="631" cy="92" rx="9" ry="3.5"/><path d="M622 92 v12 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-12"/><path d="M622 98 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5"/></g>
<text x="650" y="103" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Redis</text>
<text x="622" y="130" font-size="13" fill="#475569" font-weight="400" text-anchor="start">display fields of every</text>
<text x="622" y="150" font-size="13" fill="#475569" font-weight="400" text-anchor="start">message, plus bodies</text>
<rect x="622" y="186" width="95.0" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5"/><text x="669.5" y="201" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="middle">memory-only</text>
<rect x="600" y="250" width="210" height="130" rx="12" fill="#ffffff" stroke="#7dd3fc" filter="url(#shadow)"/>
<rect x="600" y="250" width="6" height="130" rx="3" fill="#0369a1"/>
<g fill="none" stroke="#0369a1" stroke-width="1.8"><ellipse cx="631" cy="272" rx="9" ry="3.5"/><path d="M622 272 v12 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-12"/><path d="M622 278 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5"/></g>
<text x="650" y="283" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="622" y="310" font-size="13" fill="#475569" font-weight="400" text-anchor="start">header index only:</text>
<text x="622" y="330" font-size="13" fill="#475569" font-weight="400" text-anchor="start">UIDs, flags, threading</text>
<rect x="622" y="346" width="81.0" height="22" rx="11" fill="#f0f9ff" stroke="#7dd3fc"/><text x="662.5" y="361" font-size="11.5" fill="#0369a1" font-weight="600" text-anchor="middle">permanent</text>
<rect x="890" y="70" width="170" height="150" rx="12" fill="#ffffff" stroke="#6ee7b7" filter="url(#shadow)"/>
<rect x="890" y="70" width="6" height="150" rx="3" fill="#047857"/>
<g fill="none" stroke="#047857" stroke-width="1.8"><rect x="912" y="89" width="18" height="14" rx="2.5"/><path d="M913 91 l8 6 l8 -6"/></g>
<text x="940" y="103" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">IMAP</text>
<text x="912" y="130" font-size="13" fill="#475569" font-weight="400" text-anchor="start">the mail itself</text>
<text x="912" y="150" font-size="13" fill="#475569" font-weight="400" text-anchor="start">source of truth</text>
<rect x="912" y="186" width="81.0" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/><text x="952.5" y="201" font-size="11.5" fill="#047857" font-weight="600" text-anchor="middle">permanent</text>
<line x1="254" y1="145" x2="306" y2="145" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="135.0" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">miss</text>
<line x1="524" y1="145" x2="596" y2="145" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="135.0" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">miss</text>
<line x1="814" y1="145" x2="886" y2="145" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="850.0" y="135.0" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">miss</text>
<line x1="705" y1="248" x2="705" y2="224" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="716" y="241" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">which ids exist</text>
<text x="40" y="262" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Every click is answered from the</text>
<text x="40" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start">nearest layer that has the data.</text>
<text x="40" y="316" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Subjects, senders and bodies never</text>
<text x="40" y="336" font-size="13" fill="#475569" font-weight="400" text-anchor="start">change, so cached copies never go stale.</text>
<text x="40" y="370" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start" font-style="italic">Cleared on sign-out.</text>
<text x="890" y="262" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Touched only on a</text>
<text x="890" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start">miss, with one fetch</text>
<text x="890" y="302" font-size="13" fill="#475569" font-weight="400" text-anchor="start">per folder.</text>
</g>
</svg>
