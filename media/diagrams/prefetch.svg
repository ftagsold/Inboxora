<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-label="What the browser and the server load ahead of time">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="1039" height="379" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="1000" height="160" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="5 4"/><text letter-spacing="1.2" x="38" y="48" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start">BROWSER · WHILE YOU WORK</text>
<rect x="20" y="200" width="1000" height="160" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="5 4"/><text letter-spacing="1.2" x="38" y="228" font-size="11.5" fill="#6d28d9" font-weight="700" text-anchor="start">SERVER · IN THE BACKGROUND</text>
<rect x="40" y="62" width="225" height="100" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<path d="M40 74 a12 12 0 0 1 12 -12 h201 a12 12 0 0 1 12 12 v26 h-225 z" fill="#eff6ff"/>
<line x1="40" y1="100" x2="265" y2="100" stroke="#93c5fd"/>
<text letter-spacing="1" x="56" y="87" font-size="10.5" fill="#1d4ed8" font-weight="700" text-anchor="start">WHEN</text>
<text x="100" y="87" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start">app is idle</text>
<text x="56" y="126" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Load every INBOX</text>
<text x="56" y="146" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">first page of each account</text>
<rect x="285" y="62" width="225" height="100" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<path d="M285 74 a12 12 0 0 1 12 -12 h201 a12 12 0 0 1 12 12 v26 h-225 z" fill="#eff6ff"/>
<line x1="285" y1="100" x2="510" y2="100" stroke="#93c5fd"/>
<text letter-spacing="1" x="301" y="87" font-size="10.5" fill="#1d4ed8" font-weight="700" text-anchor="start">WHEN</text>
<text x="345" y="87" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start">you hover a folder</text>
<text x="301" y="126" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Load its first page</text>
<text x="301" y="146" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">before you click</text>
<rect x="530" y="62" width="225" height="100" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<path d="M530 74 a12 12 0 0 1 12 -12 h201 a12 12 0 0 1 12 12 v26 h-225 z" fill="#eff6ff"/>
<line x1="530" y1="100" x2="755" y2="100" stroke="#93c5fd"/>
<text letter-spacing="1" x="546" y="87" font-size="10.5" fill="#1d4ed8" font-weight="700" text-anchor="start">WHEN</text>
<text x="590" y="87" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start">a list loads</text>
<text x="546" y="126" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Load 8 unread bodies</text>
<text x="546" y="146" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">and the next page</text>
<rect x="775" y="62" width="225" height="100" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<path d="M775 74 a12 12 0 0 1 12 -12 h201 a12 12 0 0 1 12 12 v26 h-225 z" fill="#eff6ff"/>
<line x1="775" y1="100" x2="1000" y2="100" stroke="#93c5fd"/>
<text letter-spacing="1" x="791" y="87" font-size="10.5" fill="#1d4ed8" font-weight="700" text-anchor="start">WHEN</text>
<text x="835" y="87" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start">a thread opens</text>
<text x="791" y="126" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Load bodies 3 at a time</text>
<text x="791" y="146" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">outwards from the selected</text>
<rect x="40" y="242" width="306" height="100" rx="12" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<path d="M40 254 a12 12 0 0 1 12 -12 h282 a12 12 0 0 1 12 12 v26 h-306 z" fill="#f5f3ff"/>
<line x1="40" y1="280" x2="346" y2="280" stroke="#c4b5fd"/>
<text letter-spacing="1" x="56" y="267" font-size="10.5" fill="#6d28d9" font-weight="700" text-anchor="start">WHEN</text>
<text x="100" y="267" font-size="13.5" fill="#6d28d9" font-weight="700" text-anchor="start">the server starts</text>
<text x="56" y="306" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Preload subject, sender, snippet</text>
<text x="56" y="326" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">of every folder into Redis</text>
<rect x="366" y="242" width="306" height="100" rx="12" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<path d="M366 254 a12 12 0 0 1 12 -12 h282 a12 12 0 0 1 12 12 v26 h-306 z" fill="#f5f3ff"/>
<line x1="366" y1="280" x2="672" y2="280" stroke="#c4b5fd"/>
<text letter-spacing="1" x="382" y="267" font-size="10.5" fill="#6d28d9" font-weight="700" text-anchor="start">WHEN</text>
<text x="426" y="267" font-size="13.5" fill="#6d28d9" font-weight="700" text-anchor="start">a sync runs</text>
<text x="382" y="306" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Fetch display fields</text>
<text x="382" y="326" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">for new ids only</text>
<rect x="692" y="242" width="306" height="100" rx="12" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
<path d="M692 254 a12 12 0 0 1 12 -12 h282 a12 12 0 0 1 12 12 v26 h-306 z" fill="#f5f3ff"/>
<line x1="692" y1="280" x2="998" y2="280" stroke="#c4b5fd"/>
<text letter-spacing="1" x="708" y="267" font-size="10.5" fill="#6d28d9" font-weight="700" text-anchor="start">WHEN</text>
<text x="752" y="267" font-size="13.5" fill="#6d28d9" font-weight="700" text-anchor="start">mail is deleted</text>
<text x="708" y="306" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start">Drop its cached entries</text>
<text x="708" y="326" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">plus a daily sweep</text>
</g>
</svg>
